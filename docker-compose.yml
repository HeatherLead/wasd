services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: wind-forecast-portal:latest
    container_name: wind-forecast-portal
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
